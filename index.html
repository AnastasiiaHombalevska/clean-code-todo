<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App</title>
        <link
            href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
            rel="stylesheet"
            type="text/css"
        />
        <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
    </head>

    <body>
        <div class="aaa">
            <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix" />
            <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">
                Want more details&quest;
            </a>
        </div>
        <div class="centered_main_page_element">
            <p id="top_section_for_adding_element_to_list"></p>
            <label for="new_task">Add Item</label>
            <div class="task_row_wrapper">
                <input id="new_task" class="task" type="text" />
                <button class="add">Add</button>
            </div>

            <h3>Todo</h3>
            <ul id="incomplete_tasks">
                <li>
                    <input type="checkbox" />
                    <label class="task" for="pay_bills_input">Pay Bills</label>
                    <input id="pay_bills_input" type="text" class="task" />
                    <button class="edit">Edit</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="Delete" />
                    </button>
                </li>
                <li class="edit_mode">
                    <input type="checkbox" />
                    <label class="task" for="go_shopping_input">Go Shopping</label>
                    <input id="go_shopping_input" type="text" value="Go Shopping" class="task" />
                    <button class="edit">Save</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="Delete" />
                    </button>
                </li>
            </ul>
            <h3>Completed</h3>
            <ul id="completed_tasks">
                <li>
                    <input type="checkbox" checked />
                    <label class="task" for="see_the_doctor_input">See the Doctor</label>
                    <input id="see_the_doctor_input" type="text" class="task" />
                    <button class="edit">Edit</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="Delete" />
                    </button>
                </li>
            </ul>
        </div>
        <script type="text/javascript" src="app.js"></script>
    </body>
</html>
